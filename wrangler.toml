# ==============================================================================
# Véritas v2.4 — wrangler.toml
# ==============================================================================
# Configuración del Worker de Cloudflare Pages + Workers.
# Este archivo SÍ se commitea (es configuración pública). Los secrets reales
# van en `wrangler secret put <NAME>`, no en este archivo.
#
# NOTA DE CONFIGURACIÓN (flujo recomendado, dashboard-first):
# Este proyecto se despliega por defecto vía Cloudflare Pages conectado a Git
# (ver README.md, Setup). En ese flujo los bindings (D1, R2), variables y
# secrets se configuran en el DASHBOARD:
#   Workers & Pages → veritas-ai → Settings → Bindings / Variables
# y los Cron Triggers en Settings → Triggers (wrangler.toml no se lee en
# deploys vía Git; el bloque [triggers] de abajo solo aplica a `wrangler pages deploy`).
#
# Para CLI (opcional), crea los recursos y descomenta con IDs reales:
#   wrangler d1 create veritas-db
#   wrangler r2 bucket create veritas-storage
#   wrangler d1 execute veritas-db --file=./schema.sql
# ==============================================================================

name = "veritas-ai"
compatibility_date = "2025-06-01"
pages_build_output_dir = "."

# ------------------------------------------------------------------------------
# Cron Triggers (v2.3, Gap 3 del audit)
# ------------------------------------------------------------------------------
# Ejecuta /functions/purge/scheduled.js cada 6 horas.
# Cloudflare free plan soporta 3 crons con frecuencia mínima de 1 hora.
# Las zonas horarias se evalúan en UTC.
#
# ⚠️ El bloque [triggers] NO es válido en configuración de Pages (rompe
# `wrangler pages deploy` con error de validación). El cron se configura en el
# DASHBOARD: Workers & Pages → veritas-ai → Settings → Triggers → Cron Triggers
# → añadir: 0 */6 * * *
# ------------------------------------------------------------------------------
# [triggers]
# crons = ["0 */6 * * *"]

# ------------------------------------------------------------------------------
# Bindings: D1 (SQLite) y R2 (object storage)
# ------------------------------------------------------------------------------
# ------------------------------------------------------------------------------
# Bindings D1 (SQLite) y R2 (object storage).
# En este modo de despliegue (wrangler pages deploy + pages_build_output_dir)
# los bindings se leen de ESTE archivo, no del dashboard.
# ------------------------------------------------------------------------------
[[d1_databases]]
binding       = "DB"
database_name = "veritas-db"
database_id   = "5733290e-0553-4b78-8ad6-1073fac7ecf2"

# R2 desactivado (degradación elegante v2.7.2): si algún día se activa,
# descomentar y crear el bucket veritas-storage.
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "veritas-storage"

# ------------------------------------------------------------------------------
# Vars públicas (no sensibles). Disponibles en el Worker como env.<NAME>.
# Las credenciales sensibles (client secrets, API keys, encryption keys) van
# como `wrangler secret put <NAME>` y NO aparecen aquí.
# ------------------------------------------------------------------------------
[vars]
# Nota: los OAuth Client IDs (GITHUB_OAUTH_CLIENT_ID) y
# los secrets (GITHUB_OAUTH_CLIENT_SECRET,
# OAUTH_ENCRYPTION_KEY, API keys...) se configuran en el dashboard
# (Settings → Variables), NO aquí. Ver README.md → Setup.

# Lista de dominios permitidos para el proxy /api/artifact/proxy (anti-SSRF).
# Vacío = cualquier HTTPS. Recomendar rellenar con dominios conocidos en prod.
ARTIFACT_PROXY_ALLOWED_HOSTS = "unpkg.com,cdn.jsdelivr.net,esm.sh,cdn.plot.ly,api.open-meteo.com,api.semanticscholar.org,api.openalex.org,api.crossref.org,api.wikidata.org,en.wikipedia.org,hacker-news.firebaseio.com,nominatim.openstreetmap.org,registry.npmjs.org,pypi.org,crt.sh,www.cisa.gov,nvd.nist.gov,api.nasa.gov,sec-api.io,rdap.arin.net,api.geonames.org"

# Versión pública de la app (visible en Ajustes → Acerca de).
APP_VERSION = "2.7.1"

# ------------------------------------------------------------------------------
# Observabilidad — Cloudflare Logs (ACTIVADO v2.7)
# Workers Logs: gratuito en todos los planes con cuota de eventos (free tier
# ~500K eventos/mes). head_sampling_rate=1.0 registra todos los requests
# (ideal para depuración); en producción con mucho tráfico, bajar a 0.1.
# ------------------------------------------------------------------------------
# ⚠️ El bloque [observability] NO es válido en configuración de Pages (rompe
# `wrangler pages deploy` con error de validación). En Pages los logs se
# activan solos desde el dashboard: Workers & Pages → veritas-ai → Logs.
# ------------------------------------------------------------------------------
# [observability]
# enabled = true
# head_sampling_rate = 0.1

# ------------------------------------------------------------------------------
# Limits del Worker (defaults de Cloudflare, documentados aquí para referencia)
# ------------------------------------------------------------------------------
# CPU:        10 ms (free) / 50 ms (paid) por request.
# Subrequest: 50 (free) / 1000 (paid) por request.
# Memory:     128 MB.
# Stream:     sin límite explícito; el body pasa a través vía TransformStream.

# ------------------------------------------------------------------------------
# Dev local (wrangler dev)
# ------------------------------------------------------------------------------
# Para desarrollo local, crea un archivo .dev.vars (NO se commitea, está en
# .gitignore) con los secrets de prueba en formato KEY=VALUE:
#
#   OPENROUTER_API_KEY_1=sk-or-v1-...
#   GITHUB_OAUTH_CLIENT_SECRET=...
#   OAUTH_ENCRYPTION_KEY=<openssl rand -hex 32>
#   DEV_USER_EMAIL=dev@veritas.local
#   ADMIN_EMAILS=dev@veritas.local
#
# wrangler dev carga .dev.vars automáticamente.

# ------------------------------------------------------------------------------
# Notas sobre secrets (aplicar en prod con `wrangler secret put <NAME>`):
# ------------------------------------------------------------------------------
# OPENROUTER_API_KEY_1, _2, _N         (pool, mínimo 1, recomendado 2-3)
# JINA_API_KEY_1, _2, _N               (opcional, web_search)
# TAVILY_API_KEY_1, _2, _N             (opcional, web_search)
# SERPER_API_KEY_1, _2, _N             (opcional, web_search)
# SCRAPINGBEE_API_KEY_1, _2, _N        (opcional, scrape_url con render_js)
# FIRECRAWL_API_KEY_1, _2, _N          (opcional, firecrawl_scrape/crawl)
# BROWSER_USE_API_KEY_1, _2, _N        (opcional, browser_use_browse)
# STEEL_API_KEY_1, _2, _N              (opcional, steel_session)
# GITHUB_OAUTH_CLIENT_SECRET           (obligatorio para conexiones GitHub)
# OAUTH_ENCRYPTION_KEY                 (32 bytes hex, obligatorio)
# DEV_USER_EMAIL                       (solo dev local)
# ADMIN_EMAILS                         (CSV, para endpoints /api/keys/*)
# ==============================================================================
